name: PR preview

# Builds each pull request and publishes it to gh-pages:/pr-preview/pr-<n>/, then keeps one
# comment on the PR up to date with the link. When the PR is closed or merged, the folder is
# deleted again. Plain git and the gh CLI that ships on GitHub's runners: no third-party actions.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.number }}
  PREVIEW_DIR: pr-preview/pr-${{ github.event.number }}
  CLOSED: ${{ github.event.action == 'closed' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.CLOSED != 'true'
      - uses: actions/setup-node@v4
        if: env.CLOSED != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOSED != 'true'
      - run: npm run check:refs
        if: env.CLOSED != 'true'
      - run: npm run build
        if: env.CLOSED != 'true'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/${{ env.PREVIEW_DIR }}/

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          site="$RUNNER_TEMP/gh-pages"
          rm -rf "$site"
          git init -q -b gh-pages "$site"
          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$remote"

          # Another workflow (the main deploy or another PR) may push in between, so each try
          # starts again from the latest gh-pages and re-applies this PR's folder.
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin gh-pages; then
              git reset -q --hard FETCH_HEAD
            elif [ "$CLOSED" = true ]; then
              echo "No gh-pages branch, so there is no preview to remove."
              exit 0
            fi
            rm -rf "$PREVIEW_DIR"
            if [ "$CLOSED" != true ]; then
              mkdir -p "$PREVIEW_DIR"
              cp -R "$GITHUB_WORKSPACE/dist/." "$PREVIEW_DIR/"
            fi
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing changed on gh-pages."
              exit 0
            fi
            if [ "$CLOSED" = true ]; then
              git commit -q -m "Remove preview for PR #$PR"
            else
              git commit -q -m "Preview for PR #$PR at ${SHA:0:7}"
            fi
            if git push -q origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying from the latest gh-pages."
            sleep $((attempt * 3))
          done
          echo "Could not push to gh-pages after 5 attempts." >&2
          exit 1

      - name: Comment the link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          marker='<!-- pr-preview -->'
          url="https://${OWNER,,}.github.io/${REPO_NAME}/${PREVIEW_DIR}/"
          if [ "$CLOSED" = true ]; then
            body="$marker
          **Preview removed** because the pull request was closed."
          else
            body="$marker
          **Preview** of this pull request:

          - Tabernacle: $url
          - Temple: ${url}?site=temple

          Built from ${SHA:0:7}. GitHub Pages can take a minute to update after this comment."
          fi
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | awk "NR==1")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          elif [ "$CLOSED" != true ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
